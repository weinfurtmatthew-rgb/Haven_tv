name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Build release APK
        run: ./gradlew --stacktrace assembleRelease -PversionCode=${{ github.run_number }} -PupdateRepo=${{ github.repository }}

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk haven.apk

      - uses: actions/upload-artifact@v4
        with:
          name: haven-1.0.${{ github.run_number }}
          path: haven.apk

      # Every build of main becomes the "latest" release, so this link always points at the newest APK:
      # https://github.com/<owner>/haven-tv/releases/latest/download/haven.apk
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" haven.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Haven 1.0.${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Install link for the TV box: https://github.com/${{ github.repository }}/releases/latest/download/haven.apk"
