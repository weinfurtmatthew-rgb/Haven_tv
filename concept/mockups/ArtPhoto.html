<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Art Mode Photo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #D8D2C6; font-family: 'Manrope', system-ui, sans-serif">

  <!-- Frame -->
  <div style="position: absolute; left: 180px; top: 80px; width: 1560px; height: 920px; box-sizing: border-box; background: #E9E4DA; padding: 20px; box-shadow: 0 30px 60px rgba(40,30,20,0.35)">
    <!-- Matte -->
    <div style="position: relative; width: 100%; height: 100%; box-sizing: border-box; background: #FBFAF7; padding: 70px 70px 110px 70px">
      <!-- Photo placeholder: lakeside scene -->
      <div style="position: relative; width: 100%; height: 100%; overflow: hidden; background: #A9CCE6">
        <div style="position: absolute; right: 220px; top: 80px; width: 150px; height: 150px; border-radius: 75px; background: #FBE7B0"></div>
        <div style="position: absolute; left: -120px; bottom: 260px; width: 760px; height: 300px; border-radius: 380px 380px 0 0; background: #5E8C6A"></div>
        <div style="position: absolute; left: 380px; bottom: 260px; width: 900px; height: 220px; border-radius: 450px 450px 0 0; background: #7BA37F"></div>
        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 270px; background: #4F86A8"></div>
        <div style="position: absolute; left: 640px; bottom: 150px; width: 260px; height: 10px; border-radius: 5px; background: rgba(255,255,255,0.5)"></div>
        <div style="position: absolute; left: 580px; bottom: 100px; width: 380px; height: 10px; border-radius: 5px; background: rgba(255,255,255,0.35)"></div>
        <div style="position: absolute; left: 1010px; bottom: 270px; width: 120px; height: 56px; border-radius: 0 0 60px 60px; background: #F3EFE8"></div>
      </div>
      <!-- Caption -->
      <div style="position: absolute; left: 70px; bottom: 36px; display: flex; gap: 16px; align-items: baseline; font-size: 24px; color: #5B5348">
        <span style="font-weight: 700">Lake day</span>
        <span style="font-weight: 500">July 2025</span>
      </div>
      <div style="position: absolute; right: 70px; bottom: 36px; font-size: 20px; font-weight: 500; color: #6A6256">From your Photos</div>
    </div>
  </div>

  <!-- Wake hint -->
  <a href="Living.html" style="position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 24px; box-sizing: border-box; border-radius: 22px; background: rgba(13,16,20,0.86); color: #EEF1F5; font-size: 18px; font-weight: 600; text-decoration: none; white-space: nowrap">
    <span>Art mode · Photos</span>
    <span style="color: #A3ADBA; font-weight: 500">Press any button to exit</span>
  </a>

</div>
</body>
</html>
