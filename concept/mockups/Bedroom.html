<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bedroom Home</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
body{margin:0}
button{font-family:inherit;color:inherit;border:0;padding:0;margin:0;background:none;cursor:pointer;text-align:left}
</style>
</head>
<body>
<div style="position: relative; width: 1920px; height: 1080px; box-sizing: border-box; padding: 64px 96px; display: flex; flex-direction: column; gap: 40px; overflow: hidden; background: #0D1014; color: #EEF1F5; font-family: 'Manrope', system-ui, sans-serif">

  <!-- Top bar -->
  <div style="display: flex; align-items: center; justify-content: space-between; height: 72px">
    <div style="display: flex; align-items: baseline; gap: 20px">
      <span style="font-size: 56px; font-weight: 800; letter-spacing: -1px">8:15</span>
      <span style="font-size: 24px; font-weight: 600; color: #A3ADBA">PM</span>
      <span style="font-size: 26px; font-weight: 500; color: #A3ADBA; margin-left: 12px">Wednesday, October 21</span>
    </div>
    <div style="display: flex; align-items: center; gap: 16px">
      <div style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 24px; border-radius: 28px; background: #1F2630; font-size: 22px; font-weight: 700">
        <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#7DD3FC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
        <span>Bedroom</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 24px; border-radius: 28px; background: #171C23; font-size: 22px; font-weight: 600">
        <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#EEF1F5" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span>64° Clear</span>
      </div>
      <button aria-label="Network" style="display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 28px; background: #171C23">
        <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#EEF1F5" stroke-width="1.8" stroke-linecap="round"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1" fill="#EEF1F5"/></svg>
      </button>
      <button aria-label="Settings" style="display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 28px; background: #171C23">
        <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#EEF1F5" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h3m4 0h9M4 12h9m4 0h3M4 17h5m4 0h7"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="11" cy="17" r="2"/></svg>
      </button>
      <button aria-label="Profile" style="display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 28px; background: #2B4C7E; font-size: 24px; font-weight: 700">M</button>
    </div>
  </div>

  <!-- Continue watching -->
  <div style="display: flex; flex-direction: column; gap: 20px">
    <div style="font-size: 28px; font-weight: 700">Continue watching</div>
    <div style="display: flex; align-items: flex-start; gap: 24px">

      <button style="display: flex; flex-direction: column; gap: 14px; flex-shrink: 0; width: 520px">
        <span style="display: block; position: relative; width: 520px; height: 292px; border-radius: 16px; background: #2B4C7E; overflow: hidden">
          <span style="position: absolute; right: -60px; top: -80px; width: 320px; height: 320px; border-radius: 160px; background: rgba(255,255,255,0.14)"></span>
          <span style="position: absolute; left: 36px; bottom: 44px; width: 120px; height: 120px; border-radius: 16px; background: rgba(255,255,255,0.10)"></span>
          <span style="position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: rgba(255,255,255,0.22)"><span style="display: block; width: 62%; height: 8px; background: #7DD3FC"></span></span>
        </span>
        <span style="display: block; font-size: 28px; font-weight: 700">Harbor Lights</span>
        <span style="display: block; font-size: 20px; font-weight: 500; color: #A3ADBA; margin-top: -8px">Season 2 · Episode 4 · 22 min left</span>
      </button>

      <button style="display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; width: 360px">
        <span style="display: block; position: relative; width: 360px; height: 203px; border-radius: 16px; background: #5B3F8C; overflow: hidden">
          <span style="position: absolute; right: -40px; top: -50px; width: 220px; height: 220px; border-radius: 110px; background: rgba(255,255,255,0.14)"></span>
          <span style="position: absolute; left: 24px; bottom: 32px; width: 84px; height: 84px; border-radius: 12px; background: rgba(255,255,255,0.10)"></span>
          <span style="position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: rgba(255,255,255,0.22)"><span style="display: block; width: 30%; height: 6px; background: #7DD3FC"></span></span>
        </span>
        <span style="display: block; font-size: 22px; font-weight: 700">Nightfall Kitchen</span>
        <span style="display: block; font-size: 18px; font-weight: 500; color: #A3ADBA; margin-top: -6px">Episode 9 · 41 min left</span>
      </button>

      <button style="display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; width: 360px">
        <span style="display: block; position: relative; width: 360px; height: 203px; border-radius: 16px; background: #2F6B57; overflow: hidden">
          <span style="position: absolute; right: -40px; top: -50px; width: 220px; height: 220px; border-radius: 110px; background: rgba(255,255,255,0.14)"></span>
          <span style="position: absolute; left: 24px; bottom: 32px; width: 84px; height: 84px; border-radius: 12px; background: rgba(255,255,255,0.10)"></span>
          <span style="position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: rgba(255,255,255,0.22)"><span style="display: block; width: 78%; height: 6px; background: #7DD3FC"></span></span>
        </span>
        <span style="display: block; font-size: 22px; font-weight: 700">Trail Notes</span>
        <span style="display: block; font-size: 18px; font-weight: 500; color: #A3ADBA; margin-top: -6px">Episode 2 · 12 min left</span>
      </button>

      <button style="display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; width: 360px">
        <span style="display: block; position: relative; width: 360px; height: 203px; border-radius: 16px; background: #8A5A2B; overflow: hidden">
          <span style="position: absolute; right: -40px; top: -50px; width: 220px; height: 220px; border-radius: 110px; background: rgba(255,255,255,0.14)"></span>
          <span style="position: absolute; left: 24px; bottom: 32px; width: 84px; height: 84px; border-radius: 12px; background: rgba(255,255,255,0.10)"></span>
          <span style="position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: rgba(255,255,255,0.22)"><span style="display: block; width: 45%; height: 6px; background: #7DD3FC"></span></span>
        </span>
        <span style="display: block; font-size: 22px; font-weight: 700">The Long Orbit</span>
        <span style="display: block; font-size: 18px; font-weight: 500; color: #A3ADBA; margin-top: -6px">Movie · 1 hr 5 min left</span>
      </button>

      <button style="display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; width: 360px">
        <span style="display: block; position: relative; width: 360px; height: 203px; border-radius: 16px; background: #6B2F3C; overflow: hidden">
          <span style="position: absolute; right: -40px; top: -50px; width: 220px; height: 220px; border-radius: 110px; background: rgba(255,255,255,0.14)"></span>
          <span style="position: absolute; left: 24px; bottom: 32px; width: 84px; height: 84px; border-radius: 12px; background: rgba(255,255,255,0.10)"></span>
          <span style="position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: rgba(255,255,255,0.22)"><span style="display: block; width: 15%; height: 6px; background: #7DD3FC"></span></span>
        </span>
        <span style="display: block; font-size: 22px; font-weight: 700">Paper Cities</span>
        <span style="display: block; font-size: 18px; font-weight: 500; color: #A3ADBA; margin-top: -6px">Episode 6 · 30 min left</span>
      </button>

    </div>
  </div>

  <!-- Apps -->
  <div style="display: flex; flex-direction: column; gap: 20px">
    <div style="font-size: 28px; font-weight: 700">Apps</div>
    <div style="display: flex; gap: 24px">

      <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; flex-shrink: 0; width: 220px; height: 124px; border-radius: 16px; background: #171C23">
        <svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#EEF1F5" stroke-width="1.5" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M10 9l5 3-5 3z"/></svg>
        <span style="font-size: 20px; font-weight: 600">Streams</span>
      </button>

      <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; flex-shrink: 0; width: 220px; height: 124px; border-radius: 16px; background: #171C23">
        <svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#EEF1F5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="16" r="2"/></svg>
        <span style="font-size: 20px; font-weight: 600">Music</span>
      </button>

      <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; flex-shrink: 0; width: 220px; height: 124px; border-radius: 16px; background: #171C23">
        <svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#EEF1F5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M3 17l5-5 4 4 3-3 6 6"/></svg>
        <span style="font-size: 20px; font-weight: 600">Photos</span>
      </button>

      <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; flex-shrink: 0; width: 220px; height: 124px; border-radius: 16px; background: #171C23">
        <svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#EEF1F5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="11" rx="5.5"/><path d="M7 12.5h4M9 10.5v4"/><circle cx="16" cy="11.5" r="0.8"/><circle cx="18" cy="13.5" r="0.8"/></svg>
        <span style="font-size: 20px; font-weight: 600">Games</span>
      </button>

      <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; flex-shrink: 0; width: 220px; height: 124px; border-radius: 16px; background: #171C23">
        <svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#EEF1F5" stroke-width="1.5" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span style="font-size: 20px; font-weight: 600">Files</span>
      </button>

      <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; flex-shrink: 0; width: 220px; height: 124px; border-radius: 16px; background: #171C23">
        <svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#EEF1F5" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
        <span style="font-size: 20px; font-weight: 600">Browser</span>
      </button>

      <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; flex-shrink: 0; width: 220px; height: 124px; border-radius: 16px; background: #171C23">
        <svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#EEF1F5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6M3 12a8 8 0 0 1 8 8M3 16a4 4 0 0 1 4 4"/><circle cx="3.5" cy="20.5" r="0.8"/></svg>
        <span style="font-size: 20px; font-weight: 600">Cast</span>
      </button>

    </div>
  </div>

  <!-- Room controls -->
  <div style="display: flex; flex-direction: column; gap: 20px">
    <div style="font-size: 28px; font-weight: 700">Bedroom</div>
    <div style="display: flex; gap: 24px">

      <button style="display: flex; align-items: center; gap: 14px; flex-shrink: 0; width: 268px; height: 96px; padding: 0 20px; box-sizing: border-box; border-radius: 16px; background: #1F2630; outline: 2px solid #7DD3FC; outline-offset: -2px">
        <svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#7DD3FC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M4 4l3-2M20 4l-3-2"/></svg>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 21px; font-weight: 700">Alarm</span><span style="font-size: 17px; font-weight: 500; color: #A3ADBA">6:30 AM · Weekdays</span></span>
      </button>

      <a href="ArtPainting.html" style="display: flex; align-items: center; gap: 14px; flex-shrink: 0; width: 268px; height: 96px; padding: 0 20px; box-sizing: border-box; border-radius: 16px; background: #171C23; text-decoration: none; color: #EEF1F5">
        <svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#7DD3FC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="1.5"/><rect x="6.5" y="6.5" width="11" height="11"/><path d="M6.5 15l3.5-3.5 2.5 2.5 2-2 3 3"/></svg>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 21px; font-weight: 700">Art mode</span><span style="font-size: 17px; font-weight: 500; color: #A3ADBA">Painting or photo</span></span>
      </a>

      <a href="LightsSpeakers.html" style="display: flex; align-items: center; gap: 14px; flex-shrink: 0; width: 268px; height: 96px; padding: 0 20px; box-sizing: border-box; border-radius: 16px; background: #171C23; text-decoration: none; color: #EEF1F5">
        <svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#7DD3FC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 21px; font-weight: 700">Lights</span><span style="font-size: 17px; font-weight: 500; color: #A3ADBA">1 of 3 on</span></span>
      </a>

      <a href="Cameras.html" style="display: flex; align-items: center; gap: 14px; flex-shrink: 0; width: 268px; height: 96px; padding: 0 20px; box-sizing: border-box; border-radius: 16px; background: #171C23; text-decoration: none; color: #EEF1F5">
        <svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#7DD3FC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM15 10l6-3v10l-6-3"/></svg>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 21px; font-weight: 700">Cameras</span><span style="font-size: 17px; font-weight: 500; color: #A3ADBA">4 cameras</span></span>
      </a>

      <a href="LightsSpeakers.html" style="display: flex; align-items: center; gap: 14px; flex-shrink: 0; width: 268px; height: 96px; padding: 0 20px; box-sizing: border-box; border-radius: 16px; background: #171C23; text-decoration: none; color: #EEF1F5">
        <svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#7DD3FC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"/><circle cx="12" cy="15" r="3.5"/><circle cx="12" cy="7" r="1"/></svg>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 21px; font-weight: 700">Speakers</span><span style="font-size: 17px; font-weight: 500; color: #A3ADBA">TV only</span></span>
      </a>

      <button style="display: flex; align-items: center; gap: 14px; flex-shrink: 0; width: 268px; height: 96px; padding: 0 20px; box-sizing: border-box; border-radius: 16px; background: #171C23">
        <svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#7DD3FC" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="7" width="18" height="10" rx="2"/><path d="M7 10v4M10 10v4M13 10v4M16 10v4"/></svg>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 21px; font-weight: 700">Inputs</span><span style="font-size: 17px; font-weight: 500; color: #A3ADBA">HDMI 1</span></span>
      </button>

    </div>
  </div>

</div>
</body>
</html>
