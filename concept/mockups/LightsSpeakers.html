<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lights and Speakers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
body{margin:0}
button{font-family:inherit;color:inherit;border:0;padding:0;margin:0;background:none;cursor:pointer;text-align:left}
</style>
</head>
<body>
<div style="position: relative; width: 1920px; height: 1080px; box-sizing: border-box; padding: 64px 96px; display: flex; flex-direction: column; gap: 32px; overflow: hidden; background: #0D1014; color: #EEF1F5; font-family: 'Manrope', system-ui, sans-serif">

  <!-- Header -->
  <div style="display: flex; align-items: center; justify-content: space-between; height: 56px">
    <div style="display: flex; align-items: center; gap: 24px">
      <a href="Living.html" aria-label="Back to Living Room" style="display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 28px; background: #171C23; text-decoration: none">
        <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#EEF1F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <span style="font-size: 40px; font-weight: 800; letter-spacing: -0.5px">Lights and speakers</span>
      <span style="font-size: 24px; font-weight: 500; color: #A3ADBA">Living Room</span>
    </div>
    <span style="font-size: 28px; font-weight: 700">8:15 PM</span>
  </div>

  <div style="display: flex; gap: 48px; align-items: stretch; flex: 1">

    <!-- Lights -->
    <div style="display: flex; flex-direction: column; gap: 24px; flex: 1; min-width: 0; box-sizing: border-box; padding: 40px; border-radius: 24px; background: #171C23">
      <div style="display: flex; align-items: center; gap: 14px">
        <svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#7DD3FC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
        <span style="font-size: 32px; font-weight: 800">Lights</span>
      </div>

      <div style="display: flex; gap: 16px">
        <button style="display: flex; align-items: center; height: 56px; padding: 0 28px; border-radius: 28px; background: #7DD3FC; color: #0D1014; font-size: 22px; font-weight: 700">Movie</button>
        <button style="display: flex; align-items: center; height: 56px; padding: 0 28px; border-radius: 28px; background: #1F2630; font-size: 22px; font-weight: 600">Reading</button>
        <button style="display: flex; align-items: center; height: 56px; padding: 0 28px; border-radius: 28px; background: #1F2630; font-size: 22px; font-weight: 600">Bright</button>
        <button style="display: flex; align-items: center; height: 56px; padding: 0 28px; border-radius: 28px; background: #1F2630; font-size: 22px; font-weight: 600">All off</button>
      </div>

      <div style="display: flex; flex-direction: column; gap: 16px">

        <div style="display: flex; align-items: center; gap: 24px; height: 120px; padding: 0 28px; box-sizing: border-box; border-radius: 16px; background: #1F2630">
          <div style="display: flex; flex-direction: column; gap: 4px; width: 200px">
            <span style="font-size: 24px; font-weight: 700">Floor lamp</span>
            <span style="font-size: 18px; font-weight: 500; color: #A3ADBA">On · 20%</span>
          </div>
          <div style="flex: 1; height: 12px; border-radius: 6px; background: #3A4553"><div style="width: 20%; height: 12px; border-radius: 6px; background: #7DD3FC"></div></div>
          <button aria-label="Floor lamp, on" aria-pressed="true" style="position: relative; flex-shrink: 0; width: 72px; height: 40px; border-radius: 20px; background: #7DD3FC"><span style="position: absolute; right: 4px; top: 4px; width: 32px; height: 32px; border-radius: 16px; background: #0D1014"></span></button>
        </div>

        <div style="display: flex; align-items: center; gap: 24px; height: 120px; padding: 0 28px; box-sizing: border-box; border-radius: 16px; background: #1F2630">
          <div style="display: flex; flex-direction: column; gap: 4px; width: 200px">
            <span style="font-size: 24px; font-weight: 700">Ceiling</span>
            <span style="font-size: 18px; font-weight: 500; color: #A3ADBA">On · 10%</span>
          </div>
          <div style="flex: 1; height: 12px; border-radius: 6px; background: #3A4553"><div style="width: 10%; height: 12px; border-radius: 6px; background: #7DD3FC"></div></div>
          <button aria-label="Ceiling, on" aria-pressed="true" style="position: relative; flex-shrink: 0; width: 72px; height: 40px; border-radius: 20px; background: #7DD3FC"><span style="position: absolute; right: 4px; top: 4px; width: 32px; height: 32px; border-radius: 16px; background: #0D1014"></span></button>
        </div>

        <div style="display: flex; align-items: center; gap: 24px; height: 120px; padding: 0 28px; box-sizing: border-box; border-radius: 16px; background: #1F2630">
          <div style="display: flex; flex-direction: column; gap: 4px; width: 200px">
            <span style="font-size: 24px; font-weight: 700">TV backlight</span>
            <span style="font-size: 18px; font-weight: 500; color: #A3ADBA">On · 60%</span>
          </div>
          <div style="flex: 1; height: 12px; border-radius: 6px; background: #3A4553"><div style="width: 60%; height: 12px; border-radius: 6px; background: #7DD3FC"></div></div>
          <button aria-label="TV backlight, on" aria-pressed="true" style="position: relative; flex-shrink: 0; width: 72px; height: 40px; border-radius: 20px; background: #7DD3FC"><span style="position: absolute; right: 4px; top: 4px; width: 32px; height: 32px; border-radius: 16px; background: #0D1014"></span></button>
        </div>

        <div style="display: flex; align-items: center; gap: 24px; height: 120px; padding: 0 28px; box-sizing: border-box; border-radius: 16px; background: #1F2630">
          <div style="display: flex; flex-direction: column; gap: 4px; width: 200px">
            <span style="font-size: 24px; font-weight: 700">Shelf lights</span>
            <span style="font-size: 18px; font-weight: 500; color: #A3ADBA">Off</span>
          </div>
          <div style="flex: 1; height: 12px; border-radius: 6px; background: #3A4553"></div>
          <button aria-label="Shelf lights, off" aria-pressed="false" style="position: relative; flex-shrink: 0; width: 72px; height: 40px; border-radius: 20px; background: #3A4553"><span style="position: absolute; left: 4px; top: 4px; width: 32px; height: 32px; border-radius: 16px; background: #EEF1F5"></span></button>
        </div>

      </div>
    </div>

    <!-- Speakers -->
    <div style="display: flex; flex-direction: column; gap: 24px; flex: 1; min-width: 0; box-sizing: border-box; padding: 40px; border-radius: 24px; background: #171C23">
      <div style="display: flex; align-items: center; gap: 14px">
        <svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#7DD3FC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"/><circle cx="12" cy="15" r="3.5"/><circle cx="12" cy="7" r="1"/></svg>
        <span style="font-size: 32px; font-weight: 800">Speakers</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 4px; padding: 20px 28px; border-radius: 16px; background: #1F2630">
        <span style="font-size: 24px; font-weight: 700">Playing what's on screen</span>
        <span style="font-size: 18px; font-weight: 500; color: #A3ADBA">Harbor Lights · synced across 3 speakers</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px">

        <button style="display: flex; align-items: center; gap: 20px; height: 84px; padding: 0 28px; box-sizing: border-box; border-radius: 16px; background: #1F2630; width: 100%">
          <span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 36px; height: 36px; border-radius: 18px; background: #7DD3FC"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0D1014" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span>
          <span style="display: flex; flex-direction: column; gap: 2px; width: 200px"><span style="font-size: 22px; font-weight: 700">TV</span><span style="font-size: 17px; font-weight: 500; color: #A3ADBA">This room</span></span>
          <span style="flex: 1; height: 10px; border-radius: 5px; background: #3A4553"><span style="display: block; width: 45%; height: 10px; border-radius: 5px; background: #7DD3FC"></span></span>
        </button>

        <button style="display: flex; align-items: center; gap: 20px; height: 84px; padding: 0 28px; box-sizing: border-box; border-radius: 16px; background: #1F2630; width: 100%">
          <span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 36px; height: 36px; border-radius: 18px; background: #7DD3FC"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0D1014" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span>
          <span style="display: flex; flex-direction: column; gap: 2px; width: 200px"><span style="font-size: 22px; font-weight: 700">Soundbar</span><span style="font-size: 17px; font-weight: 500; color: #A3ADBA">Living Room</span></span>
          <span style="flex: 1; height: 10px; border-radius: 5px; background: #3A4553"><span style="display: block; width: 60%; height: 10px; border-radius: 5px; background: #7DD3FC"></span></span>
        </button>

        <button style="display: flex; align-items: center; gap: 20px; height: 84px; padding: 0 28px; box-sizing: border-box; border-radius: 16px; background: #1F2630; width: 100%">
          <span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 36px; height: 36px; border-radius: 18px; background: #7DD3FC"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0D1014" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span>
          <span style="display: flex; flex-direction: column; gap: 2px; width: 200px"><span style="font-size: 22px; font-weight: 700">Kitchen speaker</span><span style="font-size: 17px; font-weight: 500; color: #A3ADBA">Kitchen</span></span>
          <span style="flex: 1; height: 10px; border-radius: 5px; background: #3A4553"><span style="display: block; width: 35%; height: 10px; border-radius: 5px; background: #7DD3FC"></span></span>
        </button>

        <button style="display: flex; align-items: center; gap: 20px; height: 84px; padding: 0 28px; box-sizing: border-box; border-radius: 16px; background: #171C23; outline: 2px solid #2F3946; outline-offset: -2px; width: 100%">
          <span style="flex-shrink: 0; width: 36px; height: 36px; border-radius: 18px; box-sizing: border-box; border: 3px solid #5C6877"></span>
          <span style="display: flex; flex-direction: column; gap: 2px; width: 200px"><span style="font-size: 22px; font-weight: 700">Bedroom speaker</span><span style="font-size: 17px; font-weight: 500; color: #A3ADBA">Bedroom</span></span>
          <span style="flex: 1; height: 10px; border-radius: 5px; background: #2F3946"></span>
        </button>

        <button style="display: flex; align-items: center; gap: 20px; height: 84px; padding: 0 28px; box-sizing: border-box; border-radius: 16px; background: #171C23; outline: 2px solid #2F3946; outline-offset: -2px; width: 100%">
          <span style="flex-shrink: 0; width: 36px; height: 36px; border-radius: 18px; box-sizing: border-box; border: 3px solid #5C6877"></span>
          <span style="display: flex; flex-direction: column; gap: 2px; width: 200px"><span style="font-size: 22px; font-weight: 700">Patio speaker</span><span style="font-size: 17px; font-weight: 500; color: #A3ADBA">Patio</span></span>
          <span style="flex: 1; height: 10px; border-radius: 5px; background: #2F3946"></span>
        </button>

      </div>
    </div>

  </div>

</div>
</body>
</html>
