<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cameras</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
body{margin:0}
button{font-family:inherit;color:inherit;border:0;padding:0;margin:0;background:none;cursor:pointer;text-align:left}
</style>
</head>
<body>
<div style="position: relative; width: 1920px; height: 1080px; box-sizing: border-box; padding: 64px 96px; display: flex; flex-direction: column; gap: 32px; overflow: hidden; background: #0D1014; color: #EEF1F5; font-family: 'Manrope', system-ui, sans-serif">

  <!-- Header -->
  <div style="display: flex; align-items: center; justify-content: space-between; height: 56px">
    <div style="display: flex; align-items: center; gap: 24px">
      <a href="Living.html" aria-label="Back to Living Room" style="display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 28px; background: #171C23; text-decoration: none">
        <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#EEF1F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <span style="font-size: 40px; font-weight: 800; letter-spacing: -0.5px">Cameras</span>
      <span style="font-size: 24px; font-weight: 500; color: #A3ADBA">Living Room</span>
    </div>
    <span style="font-size: 28px; font-weight: 700">8:15 PM</span>
  </div>

  <div style="display: flex; gap: 24px; align-items: flex-start">

    <!-- Main feed -->
    <div style="display: flex; flex-direction: column; gap: 24px; flex-shrink: 0; width: 1224px">
      <div style="position: relative; width: 1224px; height: 689px; border-radius: 20px; overflow: hidden; background: #202A36; outline: 4px solid #EEF1F5; outline-offset: 4px">
        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 34%; background: #2C3A4A"></div>
        <div style="position: absolute; left: 420px; top: 120px; width: 220px; height: 420px; border-radius: 12px 12px 0 0; background: #3A4A5E"></div>
        <div style="position: absolute; left: 600px; top: 330px; width: 14px; height: 14px; border-radius: 7px; background: #A3ADBA"></div>
        <div style="position: absolute; left: 780px; top: 90px; width: 360px; height: 360px; border-radius: 180px; background: rgba(255,255,255,0.06)"></div>
        <div style="position: absolute; left: 24px; top: 24px; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 18px; border-radius: 22px; background: rgba(13,16,20,0.78); font-size: 20px; font-weight: 700">
          <span style="display: block; width: 12px; height: 12px; border-radius: 6px; background: #FF7A70"></span>
          <span>Live</span>
        </div>
        <div style="position: absolute; left: 24px; bottom: 24px; display: flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 22px; background: rgba(13,16,20,0.78); font-size: 20px; font-weight: 700">Front Door</div>
      </div>
      <div style="display: flex; gap: 24px">
        <button style="display: flex; align-items: center; justify-content: center; gap: 12px; height: 72px; padding: 0 32px; border-radius: 36px; background: #171C23; font-size: 22px; font-weight: 700">
          <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#EEF1F5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          <span>Talk</span>
        </button>
        <button style="display: flex; align-items: center; justify-content: center; gap: 12px; height: 72px; padding: 0 32px; border-radius: 36px; background: #171C23; font-size: 22px; font-weight: 700">
          <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#EEF1F5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>
          <span>Snapshot</span>
        </button>
        <button style="display: flex; align-items: center; justify-content: center; gap: 12px; height: 72px; padding: 0 32px; border-radius: 36px; background: #171C23; font-size: 22px; font-weight: 700">
          <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#EEF1F5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          <span>Full screen</span>
        </button>
      </div>
    </div>

    <!-- Other feeds -->
    <div style="display: flex; flex-direction: column; gap: 24px; flex-shrink: 0; width: 480px">

      <button style="display: block; position: relative; width: 480px; height: 270px; border-radius: 16px; overflow: hidden; background: #26303B">
        <span style="position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background: #333F4D"></span>
        <span style="position: absolute; left: 90px; top: 70px; width: 200px; height: 90px; border-radius: 14px; background: #44566B"></span>
        <span style="position: absolute; left: 300px; top: 100px; width: 90px; height: 60px; border-radius: 10px; background: #566A82"></span>
        <span style="position: absolute; left: 16px; bottom: 16px; display: flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 18px; background: rgba(13,16,20,0.78); font-size: 18px; font-weight: 700">Driveway</span>
      </button>

      <button style="display: block; position: relative; width: 480px; height: 270px; border-radius: 16px; overflow: hidden; background: #1F3029">
        <span style="position: absolute; left: 0; right: 0; bottom: 0; height: 45%; background: #2A4437"></span>
        <span style="position: absolute; left: 60px; top: 50px; width: 110px; height: 110px; border-radius: 55px; background: #3A5F4A"></span>
        <span style="position: absolute; left: 190px; top: 80px; width: 150px; height: 150px; border-radius: 75px; background: #34553F"></span>
        <span style="position: absolute; left: 16px; bottom: 16px; display: flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 18px; background: rgba(13,16,20,0.78); font-size: 18px; font-weight: 700">Backyard</span>
      </button>

      <button style="display: block; position: relative; width: 480px; height: 270px; border-radius: 16px; overflow: hidden; background: #2B2830">
        <span style="position: absolute; left: 0; right: 0; bottom: 0; height: 30%; background: #38343F"></span>
        <span style="position: absolute; left: 70px; top: 60px; width: 340px; height: 120px; border-radius: 10px; background: #46414F"></span>
        <span style="position: absolute; left: 16px; bottom: 16px; display: flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 18px; background: rgba(13,16,20,0.78); font-size: 18px; font-weight: 700">Garage</span>
      </button>

    </div>
  </div>

</div>
</body>
</html>
