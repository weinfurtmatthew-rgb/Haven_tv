<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Art Mode Painting</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #D8D2C6; font-family: 'Manrope', system-ui, sans-serif">

  <!-- Wall shadow behind frame -->
  <div style="position: absolute; left: 180px; top: 80px; width: 1560px; height: 920px; box-sizing: border-box; background: #2B2119; padding: 28px; box-shadow: 0 30px 60px rgba(40,30,20,0.35)">
    <!-- Matte -->
    <div style="width: 100%; height: 100%; box-sizing: border-box; background: #F3EFE8; padding: 90px">
      <!-- Painting -->
      <div style="position: relative; width: 100%; height: 100%; overflow: hidden; background: #1F4E5F">
        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 38%; background: #163B49"></div>
        <div style="position: absolute; right: 180px; top: 70px; width: 300px; height: 300px; border-radius: 150px; background: #E8A33D"></div>
        <div style="position: absolute; left: 120px; bottom: 120px; width: 520px; height: 260px; border-radius: 260px 260px 0 0; background: #C8553D"></div>
        <div style="position: absolute; left: 400px; bottom: 120px; width: 600px; height: 180px; border-radius: 180px 180px 0 0; background: #F2E3C6"></div>
        <div style="position: absolute; left: 860px; bottom: 120px; width: 320px; height: 340px; border-radius: 160px 160px 0 0; background: #8FB9A8"></div>
        <div style="position: absolute; left: 0; right: 0; bottom: 120px; height: 6px; background: #F3EFE8"></div>
      </div>
    </div>
  </div>

  <!-- Wake hint -->
  <a href="Living.html" style="position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 24px; box-sizing: border-box; border-radius: 22px; background: rgba(13,16,20,0.86); color: #EEF1F5; font-size: 18px; font-weight: 600; text-decoration: none; white-space: nowrap">
    <span>Art mode · Painting</span>
    <span style="color: #A3ADBA; font-weight: 500">Press any button to exit</span>
  </a>

</div>
</body>
</html>
